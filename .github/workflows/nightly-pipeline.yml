# =============================================================================
# KovaView Nightly Pipeline
# =============================================================================
# Schedule : Mon 19:30 UTC (weekly+daily), Tue-Fri 19:30 UTC (daily only)
# Budget   : ~1,040 min/month of 2,000 free GitHub Actions minutes
#   - universe-sync       : ~4 Mon runs     x  5 min =   20 min
#   - ingest-prices       : ~22 daily runs  x 10 min =  220 min
#   - ingest-fundamentals : ~4 Mon runs     x 12 min =   48 min
#   - ingest-fin-reports  : ~4 Mon runs     x 15 min =   60 min
#   - compute-signals     : ~22 daily runs  x  8 min =  176 min
#   - ingest-pharma       : ~4 Mon runs     x 10 min =   40 min
#   - ingest-earnings     : ~22 daily runs  x  3 min =   66 min
#   - ingest-news         : ~22 daily runs  x  5 min =  110 min
#   - overhead (setup/cache)                          = ~300 min
#   Total estimate                                    ~1,040 min/month
# =============================================================================

name: KovaView Nightly Pipeline

on:
  schedule:
    # Monday 19:30 UTC — triggers weekly + daily jobs
    - cron: "30 19 * * 1"
    # Tue-Fri 19:30 UTC — triggers daily-only jobs
    - cron: "30 19 * * 2-5"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Universe Sync — weekly only (Monday) or manual trigger
  # ---------------------------------------------------------------------------
  universe-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '30 19 * * 1'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run universe sync
        run: python -m pipeline.ingest.universe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}

  # ---------------------------------------------------------------------------
  # 2. Ingest Prices — runs every weekday (even if universe-sync was skipped)
  # ---------------------------------------------------------------------------
  ingest-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: universe-sync
    if: always()
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run price ingestion
        run: python -m pipeline.ingest.prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
          LSE_DATA_API_URL: ${{ secrets.LSE_DATA_API_URL }}

  # ---------------------------------------------------------------------------
  # 3. Ingest Fundamentals — weekly only (Monday) or manual trigger
  # ---------------------------------------------------------------------------
  ingest-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ingest-prices
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '30 19 * * 1'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run fundamentals ingestion
        run: python -m pipeline.ingest.fundamentals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
          LSE_DATA_API_URL: ${{ secrets.LSE_DATA_API_URL }}

  # ---------------------------------------------------------------------------
  # 4. Ingest Financial Reports — weekly only (Monday) or manual trigger
  # ---------------------------------------------------------------------------
  ingest-financial-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ingest-fundamentals
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '30 19 * * 1'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run financial reports ingestion
        run: python -m pipeline.ingest.financial_reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}

  # ---------------------------------------------------------------------------
  # 5. Compute Signals — runs every weekday after prices are ingested
  # ---------------------------------------------------------------------------
  compute-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ingest-prices
    if: always() && needs.ingest-prices.result == 'success'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run trend radar compute
        run: python -m pipeline.compute.trend_radar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run market aggregates
        run: python -m pipeline.compute.aggregates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run F-Score compute
        run: python -m pipeline.compute.f_score
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ---------------------------------------------------------------------------
  # 6. Ingest Pharma Trials + Compute Signals — weekly (Monday) or manual
  # ---------------------------------------------------------------------------
  ingest-pharma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compute-signals
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '30 19 * * 1'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Ingest pharma trials from ClinicalTrials.gov
        run: python -m pipeline.ingest.pharma_trials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Compute pharma signals
        run: python -m pipeline.compute.pharma_signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  # ---------------------------------------------------------------------------
  # 7. Ingest Earnings + News — runs every weekday
  # ---------------------------------------------------------------------------
  ingest-earnings-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: compute-signals
    if: always() && needs.compute-signals.result == 'success'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Ingest earnings from LSE
        run: python -m pipeline.ingest.earnings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}

      - name: Ingest news from GDELT
        run: python -m pipeline.ingest.news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
