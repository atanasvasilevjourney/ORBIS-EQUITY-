# One-shot LOOP XS paper harness (service_role via Actions secrets).
name: Run LOOP XS harness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/run-loop-xs.flag"

jobs:
  loop-xs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run portfolio_loop_xs
        run: python -m pipeline.compute.portfolio_loop_xs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
