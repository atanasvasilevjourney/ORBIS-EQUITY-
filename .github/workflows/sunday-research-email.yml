# Sunday ORBIS research + watchlist email (Resend)
# Schedule: Sunday 08:00 UTC — before US cash open Monday prep
name: Sunday Research Email

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

jobs:
  send-research-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Send Sunday research digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: python -m pipeline.notify.research_weekly_digest
