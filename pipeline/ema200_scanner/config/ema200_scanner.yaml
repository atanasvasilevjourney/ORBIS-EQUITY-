mode: signal               # signal | watchlist_only
ema_period: 200
atr_period: 14
history_min_bars: 500

trend:
  min_days_above: 20
  slope_lookback: 20
  min_slope: 0.0

touch:
  touch_tolerance_atr: 0.25
  shortlist_atr: 1.5
  confirm_mode: bar_close   # intrabar | bar_close

filters:
  min_price: 5
  min_adv_usd: 20000000
  exclude_etf: false
  earnings_flag_days: 3

state:
  cooldown_days: 10
  rearm_atr: 2.0

alerts:
  max_alerts_per_day: 8
  min_score: 60
  channels: [discord, email]

regime:
  equity_benchmark: SPY
  crypto_benchmark: BTC/USDT

crypto:
  top_n: 50
  daily_close_utc: "00:00"

monitoring:
  heartbeat_max_age_min: 90

validation:
  tradingview_tolerance_pct: 0.3
  reference_symbols: [AAPL, MSFT, SPY, AMZN, NVDA]

nightly:
  min_history_bars: 550
  max_vendor_backfill_symbols: 200
  missing_data_abort_pct: 15.0
  time_budget_sec: 3600
