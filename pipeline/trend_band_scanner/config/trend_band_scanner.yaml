# pb_ema band: EMA200(high) .. EMA200(low). Heuristic scan — not a signal.
# Runs alongside ema200 watchlist (close+high ribbon proximity); this module
# targets pullback into the high/low band on daily and weekly.

ema_period: 200
history_min_bars: 200
# Daily loads need long warmup so weekly resample has ≥220 weeks (see ema200_scanner.yaml).
ema_warmup_daily_bars: 1260
weekly_history_min_bars: 220

band:
  slope_lookback_daily: 20
  slope_lookback_weekly: 8
  min_band_slope_pct: 0.0

pullback:
  swing_high_lookback_daily: 40
  swing_high_lookback_weekly: 16
  min_advance_pct: 6.0
  min_pullback_pct: 2.5
  max_pullback_pct: 28.0
  proximity_pct: 3.0
  low_touch_extra_pct: 1.5

band_flip:
  flip_lookback_daily: 12
  flip_lookback_weekly: 6

timeframes:
  - "1d"
  - "1wk"

universe:
  use_ema200_universe: true
  include_crypto: true
  supplements:
    - USO
    - XLE
    - XLV
    - XLF
    - DBC
    - GLD
    - SPY
    - QQQ
    - IWM
  indices:
    - ^GSPC
    - ^NDX
    - ^RUT
  crypto:
    - BTC-USD
    - ETH-USD
    - SOL-USD

filters:
  min_price: 5.0

scan:
  max_setups_per_tf: 50
  spark_bars_daily: 90
  spark_bars_weekly: 52
  dual_timeframe_bonus: 12