# Orbis Equity on Render — Blueprint
# https://dashboard.render.com/blueprints
#
# After first deploy:
#   1. Set env group secrets with REAL values (SUPABASE_URL, SUPABASE_SERVICE_KEY, optional LSE_*)
#      Placeholders like https://example.supabase.co will fail validation.
#   2. Apply all supabase/migrations (001→020) in the SQL editor
#   3. Manually trigger "orbis-equity-bootstrap" once
#   4. Weekday crons run prices + radar + brief + desk modules (soft-fail per desk)

services:
  # One-shot / rare seed job — trigger manually from Render dashboard
  - type: cron
    name: orbis-equity-bootstrap
    runtime: python
    plan: starter
    schedule: "0 0 1 1 *"   # essentially never; use Manual Run
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: bash pipeline/scripts/run_bootstrap.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - fromGroup: orbis-equity-pipeline

  # Monday heavy jobs (universe + fundamentals + pharma) then daily chain
  - type: cron
    name: orbis-equity-weekly
    runtime: python
    plan: starter
    schedule: "0 19 * * 1"  # Mon 19:00 UTC
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: bash pipeline/scripts/run_weekly.sh && bash pipeline/scripts/run_daily.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - fromGroup: orbis-equity-pipeline

  # Tue–Fri price + signal refresh
  - type: cron
    name: orbis-equity-daily
    runtime: python
    plan: starter
    schedule: "30 19 * * 2-5"  # Tue–Fri 19:30 UTC
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: bash pipeline/scripts/run_daily.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - fromGroup: orbis-equity-pipeline

  # Always-on LSE live tick stream → live_quotes (requires paid background worker)
  - type: worker
    name: orbis-equity-live-stream
    runtime: python
    plan: starter
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: bash pipeline/scripts/run_live_stream.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: LSE_STREAM_LIMIT
        value: "50"
      - key: LSE_STREAM_FLUSH_SEC
        value: "2"
      - fromGroup: orbis-equity-pipeline

envVarGroups:
  - name: orbis-equity-pipeline
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LSE_API_KEY
        sync: false
      - key: LSE_API_URL
        value: https://api.londonstrategicedge.com
      - key: LSE_DATA_API_URL
        value: https://data-api.londonstrategicedge.com
