# Orbis Equity on Render — Blueprint
# https://dashboard.render.com/blueprints
#
# After first deploy:
#   1. Set env group secrets (SUPABASE_URL, SUPABASE_SERVICE_KEY, optional LSE_*)
#   2. Manually trigger "orbis-equity-bootstrap" once
#   3. Weekday crons keep prices/signals fresh

services:
  # One-shot / rare seed job — trigger manually from Render dashboard
  - type: cron
    name: orbis-equity-bootstrap
    runtime: python
    plan: starter
    schedule: "0 0 1 1 *"   # essentially never; use Manual Run
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: bash pipeline/scripts/run_bootstrap.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - fromGroup: orbis-equity-pipeline

  # Monday heavy jobs (universe + fundamentals + pharma) then daily chain
  - type: cron
    name: orbis-equity-weekly
    runtime: python
    plan: starter
    schedule: "30 21 * * 1"  # Mon 21:30 UTC — after US cash close
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: bash pipeline/scripts/run_weekly.sh && bash pipeline/scripts/run_daily.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - fromGroup: orbis-equity-pipeline

  # Tue–Fri price + signal refresh
  - type: cron
    name: orbis-equity-daily
    runtime: python
    plan: starter
    schedule: "30 21 * * 2-5"  # Tue–Fri 21:30 UTC — after US cash close
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: bash pipeline/scripts/run_daily.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - fromGroup: orbis-equity-pipeline

  # Saturday catch-up for a Friday close the weekday job missed
  - type: cron
    name: orbis-equity-saturday
    runtime: python
    plan: starter
    schedule: "0 12 * * 6"  # Sat 12:00 UTC
    buildCommand: pip install -r pipeline/requirements.txt
    startCommand: bash pipeline/scripts/run_daily.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - fromGroup: orbis-equity-pipeline

envVarGroups:
  - name: orbis-equity-pipeline
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LSE_API_KEY
        sync: false
      - key: LSE_API_URL
        value: https://api.londonstrategicedge.com
      - key: LSE_DATA_API_URL
        value: https://data-api.londonstrategicedge.com
